[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genevac-sentinel"
version = "0.1.0"
description = "Educational 2D evacuation simulation MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GenEvac Team" }
]
dependencies = [
    "pygame>=2.6.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
